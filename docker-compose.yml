version: '3.8'

services:
  marketmate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketmate-ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:5000
    env_file:
      - ./server/.env
    volumes:
      - marketmate_data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  marketmate_data:
    driver: local
